<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token Lens</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <h1>Token Lens</h1>
      <p>Токены по одному запросу, thread и дням</p>
    </div>
    <button id="refresh">Обновить</button>
  </header>

  <main>
    <section class="metrics" id="metrics"></section>

    <section class="panel">
      <div class="panel-head">
        <h2>Динамика по дням</h2>
      </div>
      <div class="chart" id="dailyChart"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Задачи целиком</h2>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Финиш</th>
              <th>Thread</th>
              <th>Models</th>
              <th>Calls</th>
              <th>Total</th>
              <th>Input</th>
              <th>Cached</th>
              <th>Output</th>
              <th>Reasoning</th>
            </tr>
          </thead>
          <tbody id="tasks"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Model calls</h2>
        <select id="modelFilter">
          <option value="">Все модели</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Время</th>
              <th>Thread</th>
              <th>Model</th>
              <th>Total</th>
              <th>Input</th>
              <th>Cached</th>
              <th>Output</th>
              <th>Reasoning</th>
            </tr>
          </thead>
          <tbody id="turns"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>Топ запросов по total tokens</h2>
      <div id="topTurns" class="top-list"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
